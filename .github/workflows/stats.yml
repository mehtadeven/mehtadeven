# Builds your GitHub stats cards inside YOUR repo once a day.
# Why: the public github-readme-stats server is rate-limited and often shows broken images.
# Output: profile/stats.svg and profile/top-langs.svg (used in README.md)

name: Update stats cards

on:
  schedule:
    - cron: "30 0 * * *" # every day at 06:00 IST
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push: # also runs once right after this file is added
    branches: [main]
    paths: ['.github/workflows/stats.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&card_width=495&show_icons=true&hide_border=true&bg_color=0d1117&title_color=7f77dd&icon_color=7f77dd&text_color=c9d1d9&ring_color=7f77dd
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true" # keep the last good card if the GitHub API hiccups

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&card_width=495&layout=compact&langs_count=6&hide_border=true&bg_color=0d1117&title_color=7f77dd&text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true" # keep the last good card if the GitHub API hiccups

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update stats cards" || exit 0
          git push
