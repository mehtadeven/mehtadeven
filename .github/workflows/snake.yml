# Turns your contribution graph into a snake animation once a day.
# Output: pushed to a branch called "output" (README.md reads it from there)

name: Generate contribution snake

on:
  schedule:
    - cron: "0 1 * * *" # every day at 06:30 IST
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push: # also runs once right after this file is added
    branches: [main]
    paths: ['.github/workflows/snake.yml']

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Build snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7f77dd&color_dots=#ebedf0,#d9d6f7,#b4aef0,#7f77dd,#4b3fa8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7f77dd&color_dots=#161b22,#2e2a5a,#4b3fa8,#7f77dd,#b4aef0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
