 <animateTransform attributeName="gradientTransform" type="translate" values="0 0;81 0;0 0" dur="5s" repeatCount="indefinite" /></linearGradient>
<linearGradient id="edgeg" x1="0" x2="1"><stop offset="0" stop-color="#7f77dd" /><stop offset="1" stop-color="#f2665a" /></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1440" /><stop offset="1" stop-color="#0b0f1a" /></linearGradient>
