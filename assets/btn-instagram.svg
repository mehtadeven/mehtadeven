@keyframes shine{0%{transform:translateX(-120px)}55%,100%{transform:translateX(418px)}}.shine{animation:shine 3.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}.nudge{animation:nudge 1.3s ease-in-out infinite}
@keyframes run{to{stroke-dashoffset:-695}}.run{animation:run 3.7s linear infinite}
