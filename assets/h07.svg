<svg xmlns="http://www.w3.org/2000/svg" width="900" height="68" viewBox="0 0 900 68"><style>
.orb{font-family:'Orb','Segoe UI',Verdana,sans-serif}
.mono{font-family:'JBM',Consolas,'Liberation Mono',Menlo,monospace}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes hud{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hud{animation:hud 3s ease-in-out infinite}
.blink{animation:blink 1s step-end infinite}

@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
@keyframes gl{0%,93%,100%{opacity:0;transform:none}94%{opacity:.8;transform:translate(-3px,0)}95.5%{opacity:.8;transform:translate(2px,0)}97%{opacity:0}}
.gl{animation:gl 7s linear infinite}
@keyframes sl{from{transform:translateX(-160px)}to{transform:translateX(1060px)}}
.sl{animation:sl 3.5s ease-in-out infinite}
