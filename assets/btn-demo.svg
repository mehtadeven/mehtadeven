<svg xmlns="http://www.w3.org/2000/svg" width="288" height="88" viewBox="0 0 288 88"><style>
.orb{font-family:'Orb','Segoe UI',Verdana,sans-serif}
.mono{font-family:'JBM',Consolas,'Liberation Mono',Menlo,monospace}
.fb{transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes hud{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hud{animation:hud 3s ease-in-out infinite}
.blink{animation:blink 1s step-end infinite}

@keyframes glow{0%,100%{opacity:.35}50%{opacity:.85}}.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-120px)}55%,100%{transform:translateX(400px)}}.shine{animation:shine 3.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}.nudge{animation:nudge 1.3s ease-in-out infinite}
@keyframes run{to{stroke-dashoffset:-658}}.run{animation:run 4.6s linear infinite}
